<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="30" y1="60" x2="200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F4F6"/>
      <stop offset="1" stop-color="#BBBCBD"/>
    </linearGradient>
    <linearGradient id="lens" x1="120" y1="100" x2="190" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E9E9EA" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Plate behind -->
  <rect x="96" y="40" width="118" height="44" rx="10" fill="#25262A"/>
  <rect x="104" y="48" width="102" height="28" rx="6" fill="#4B4B4B"/>
  <g filter="url(#blur)">
    <rect x="112" y="56" width="18" height="12" rx="2" fill="#E9E9EA"/>
    <rect x="136" y="56" width="18" height="12" rx="2" fill="#E9E9EA"/>
    <rect x="160" y="56" width="18" height="12" rx="2" fill="#E9E9EA"/>
    <rect x="184" y="56" width="14" height="12" rx="2" fill="#E9E9EA"/>
  </g>
  <!-- ID card -->
  <rect x="26" y="70" width="168" height="110" rx="16" fill="#1C1D20"/>
  <rect x="30" y="74" width="160" height="102" rx="13" fill="url(#card)"/>
  <!-- Mosaic over the photo -->
  <g>
    <rect x="44" y="92" width="16" height="16" fill="#858894"/>
    <rect x="60" y="92" width="16" height="16" fill="#4B4B4B"/>
    <rect x="76" y="92" width="16" height="16" fill="#9DA5B6"/>
    <rect x="44" y="108" width="16" height="16" fill="#4B4B4B"/>
    <rect x="60" y="108" width="16" height="16" fill="#25262A"/>
    <rect x="76" y="108" width="16" height="16" fill="#858894"/>
    <rect x="44" y="124" width="16" height="16" fill="#9DA5B6"/>
    <rect x="60" y="124" width="16" height="16" fill="#858894"/>
    <rect x="76" y="124" width="16" height="16" fill="#4B4B4B"/>
  </g>
  <!-- Blurred text lines -->
  <g filter="url(#blur)">
    <rect x="104" y="96" width="70" height="9" rx="4.5" fill="#4B4B4B"/>
    <rect x="104" y="114" width="54" height="9" rx="4.5" fill="#858894"/>
    <rect x="104" y="132" width="62" height="9" rx="4.5" fill="#858894"/>
  </g>
  <rect x="44" y="152" width="132" height="8" rx="4" fill="#9DA5B6"/>
  <!-- Magnifier finding clues -->
  <circle cx="158" cy="146" r="30" fill="url(#lens)" stroke="#1C1D20" stroke-width="8"/>
  <path d="M152 132a16 16 0 0 1 20 6" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 168l26 26" stroke="#1C1D20" stroke-width="12" stroke-linecap="round"/>
  <path d="M182 170l22 22" stroke="#4B4B4B" stroke-width="4" stroke-linecap="round"/>
</svg>
